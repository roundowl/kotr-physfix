; KoTR_PhysFix settings
[Fixes]
; 1 = fix vehicles wedging, freezing and sinking into each other on slow contact.
; 0 = original game behaviour for those contacts (the crash guard and toi clamp stay on).
Contacts=1

[Debug]
; 1 = write statistics and stuck-vehicle reports to KoTR_PhysFix.log every 10 s.
Log=1
; 1 = F12 starts a step-by-step trace of the next two vehicles that touch something
;     (KoTR_PhysFix-trace1.log / -trace2.log). For bug reports.
TraceKey=0
